[project]
name = "synthetic-data-course"
version = "0.1.0"
description = "Starter repository for Synthetic Data Generation with Diffusion Models"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "accelerate>=1.10,<2",
    "diffusers>=0.40,<0.41",
    "matplotlib>=3.10,<4",
    "numpy>=2.2,<3",
    "pandas>=2.2,<4",
    "pillow>=11,<13",
    "safetensors>=0.6,<1",
    "torch>=2.8,<3",
    "torchvision>=0.23,<1",
    "transformers>=4.55,<6",
]

[project.scripts]
synth-data = "synthdata.data:main"
synth-train = "synthdata.train:main"
synth-generate = "synthdata.generate:main"
synth-report = "synthdata.report:main"
synth-final = "synthdata.final:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synthdata"]

# CUDA 12.8 wheels on Linux and Windows; macOS uses the default wheels (MPS).
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
